language = "C"
documentation = true
documentation_style = "c99"
no_includes = true
cpp_compat = false
pragma_once = false
include_guard = "PEPITO_H"
header = "/* Generated by cbindgen from crates/ffi. Do not edit by hand: make header */"

[export]
include = ["Tracker"]
exclude = ["HEARTBEAT_TIMEOUT"]

[parse]
parse_deps = true
include = ["pepito-client"]
