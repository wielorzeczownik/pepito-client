documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'

rust:
  - changed-files:
      - any-glob-to-any-file:
          - 'crates/**'
          - 'Cargo.toml'
          - 'Cargo.lock'
          - 'rustfmt.toml'
          - 'cbindgen.toml'

js:
  - changed-files:
      - any-glob-to-any-file:
          - 'js/**'

php:
  - changed-files:
      - any-glob-to-any-file:
          - 'php/**'
          - 'composer.json'
          - 'composer.lock'
          - 'pint.json'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'Cargo.lock'
          - 'js/package.json'
          - 'js/package-lock.json'
          - 'composer.json'
          - 'composer.lock'
          - 'renovate.json'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
