[package]
name = "pepito-client"
description = "Pepito API client (the cat with the cat flap): SSE events, state, cache and historical statistics. No IO, runs on wasm too."
readme = "README.md"
keywords = ["pepito", "sse", "cat"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }

# Network client, feature "net" only
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "stream",
  "charset",
  "http2",
  "rustls",
], optional = true }
futures-util = { version = "0.3.34", default-features = false, features = [
  "std",
], optional = true }
# Timers that tick on wasm32
futures-timer = { version = "3.0.3", features = ["wasm-bindgen"], optional = true }

[features]
default = []
net = ["dep:reqwest", "dep:futures-util", "dep:futures-timer"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[[example]]
name = "watch"
required-features = ["net"]
