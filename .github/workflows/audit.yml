name: Security Audit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-audit
  cancel-in-progress: false

permissions: {}

jobs:
  audit:
    name: Audit dependencies (cargo, npm, composer)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install JS dependencies
        working-directory: js
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: ffi, json, curl
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Run audit
        id: audit
        shell: bash
        run: bash scripts/security-audit.sh

      - name: Stage audit fix
        if: ${{ steps.audit.outputs.changed == 'true' }}
        run: git add js/package-lock.json

      - name: Commit fix
        if: ${{ steps.audit.outputs.changed == 'true' }}
        uses: qoomon/actions--create-commit@7102b1a8b3cb8716dc70dbeb6d774c375d779d2f # v1.2.5
        with:
          message: 'fix(deps): resolve npm audit advisories'
          skip-empty: true

      - name: Push audit fix
        if: ${{ steps.audit.outputs.changed == 'true' }}
        run: git push

      - name: Create issue
        if: ${{ steps.audit.outputs.unresolved == 'true' }}
        uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          filename: .github/security-advisory-issue.md
          assignees: ${{ github.repository_owner }}
          search_existing: open
          update_existing: true

      - name: Find advisory issue
        id: advisory_issue
        if: ${{ steps.audit.outputs.unresolved == 'false' }}
        uses: micalevisk/last-issue-action@010dfff63530f63c7a9fd54211bde51cc38cff73 # v2.4.0
        with:
          labels: security advisory
          state: open

      - name: Close advisory issue
        if: ${{ steps.audit.outputs.unresolved == 'false' && steps.advisory_issue.outputs.has-found == 'true' }}
        uses: peter-evans/close-issue@05dff7ca07116e5707cfb3a3cd4af7bb5e43524c # v3.0.2
        with:
          issue-number: ${{ steps.advisory_issue.outputs.issue-number }}
          comment: 'cargo audit, composer audit and npm audit no longer report advisories.'
