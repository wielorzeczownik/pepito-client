name: Bug report
description: Something is not working correctly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, check if the issue already exists in [open issues](https://github.com/wielorzeczownik/pepito-client/issues).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: dropdown
    id: binding
    attributes:
      label: Binding
      options:
        - Rust (pepito-client / crates.io)
        - JS / TS (npm, wasm)
        - PHP (Composer, FFI)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 'e.g. v0.1.0'
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant error output or stack trace.
      render: text
