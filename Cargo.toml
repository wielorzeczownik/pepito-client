[workspace]
resolver = "2"
members = ["crates/core", "crates/ffi", "crates/wasm"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wielorzeczownik/pepito-client"

[workspace.dependencies]
pepito-client = { path = "crates/core", version = "0.1.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
min_ident_chars = "warn"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
